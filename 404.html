<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 24px; }
        .code { font-size: 8rem; font-weight: 900; color: #6c9fff; line-height: 1; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 12px; color: #e8e8f0; }
        p { color: #9898b8; margin-bottom: 28px; font-size: 0.95rem; }
        a { color: #6c9fff; text-decoration: none; font-size: 0.9rem; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>页面不存在</h1>
        <p>你访问的页面可能已被删除或地址错误</p>
        <a href="/">← 返回首页</a>
    </div>
</body>
</html>
